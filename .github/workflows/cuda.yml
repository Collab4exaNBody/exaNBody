name: CMake CUDA
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  CUDA_ARCH: 80

jobs:
  build:
    runs-on: ubuntu-latest
    # Build inside an NVIDIA CUDA "devel" image so nvcc and the CUDA headers/
    # libs are available. As with the HIP build, compiling for a given
    # CUDA_ARCH does not require an NVIDIA GPU on the runner — only the
    # toolkit and an explicit CMAKE_CUDA_ARCHITECTURES.
    container:
      image: nvidia/cuda:13.3.0-devel-ubuntu22.04

    steps:
    - name: Install git in container 
      run: |
        apt-get update
        apt-get install -y git
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4

    # Containers run as root, so no "sudo" is needed (and it isn't installed
    # in the nvidia/cuda image).
    - name: Install build dependencies (yaml-cpp, lcov, MPI)
      run: |
        apt-get update
        apt-get install -y libyaml-cpp-dev lcov mpich

    # Ubuntu 22.04's apt CMake (3.22) is older than onika's
    # cmake_minimum_required (3.26). Pull a recent matching cmake/ccmake
    # from Kitware's official apt repo, same as the HIP workflow.
    - name: Install recent packages
      run: |
        apt-get install -y wget gpg
        wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc \
          | gpg --dearmor - | tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null
        echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main" \
          | tee /etc/apt/sources.list.d/kitware.list
        apt-get update
        apt-get install -y cmake
        apt-get install -y zlib1g-dev
        apt-get install -y python3 python3-dev
        apt-get install -y libegl1-mesa-dev libgles2-mesa-dev xvfb
        cmake --version

    - name: Locate nvcc
      id: nvcc
      run: |
        command -v nvcc
        echo "path=$(command -v nvcc)" >> "$GITHUB_OUTPUT"

    - name: Get EGLRender
      run: |
        git clone --depth 1 https://github.com/carrardt/EGLRender.git egl

    - name: Configure EGLRender
      run: |
        cmake -B ${{github.workspace}}/egl/build \
              -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
              -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/egl/install \
              -DCMAKE_CXX_STANDARD=20
      working-directory: ${{github.workspace}}/egl
    - name: Build EGLRender
      run: |
        cmake --build ${{github.workspace}}/egl/build --target install --config ${{env.BUILD_TYPE}} -j 8

    - name: Get Onika
      run: git clone --depth 1 https://github.com/Collab4exaNBody/onika.git

    - name: Configure Onika (CUDA enabled, target sm_${{env.CUDA_ARCH}})
      run: |
        cmake -B ${{github.workspace}}/onika/build-cuda \
              -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
              -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/onika/install-cuda \
              -DONIKA_BUILD_CUDA=ON \
              -DCMAKE_CUDA_COMPILER=${{steps.nvcc.outputs.path}} \
              -DCMAKE_CUDA_ARCHITECTURES=${{env.CUDA_ARCH}}
      working-directory: ${{github.workspace}}/onika

    - name: Build Onika
      run: cmake --build ${{github.workspace}}/onika/build-cuda --target install --config ${{env.BUILD_TYPE}} -j 4
      
    - name: Configure exaNBody
      run: |
        cmake -B ${{github.workspace}}/build-cuda \
              -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
              -Donika_DIR=${{github.workspace}}/onika/install-cuda \
              -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install-cuda \
              -DEGLRender_DIR=${{github.workspace}}/egl/install/lib/cmake \
              -DEXANB_BUILD_CONTRIB_EGL=ON \
              -DEXANB_BUILD_CONTRIB_MD=ON \
              -DEXANB_BUILD_MICROSTAMP=ON \
              -DEXANB_BUILD_CONTRIB_PI=ON \
              -DEXANB_BUILD_MICROCOSMOS=ON \
              -DSNAP_CPU_USE_LOCKS=ON \
              -DSNAP_FP32_MATH=OFF

    - name: Build exaNBody
      run: |
        cmake --build ${{github.workspace}}/build-cuda --target install --config ${{env.BUILD_TYPE}} -j 8

    - name: Run exaNBody Tests (EGL)
      working-directory: ${{github.workspace}}/build-cuda
      env:
        LIBGL_ALWAYS_SOFTWARE: "1"
        GALLIUM_DRIVER: llvmpipe
        MESA_GL_VERSION_OVERRIDE: "4.6"
        MESA_GLSL_VERSION_OVERRIDE: "460"
      run: xvfb-run -a ctest -R "egl" -C --rerun-failed --output-on-failure ${{env.BUILD_TYPE}}

    - name: Run exaNBody Tests (Others)
      working-directory: ${{github.workspace}}/build-cuda
      run: ctest -E "egl" -C --rerun-failed --output-on-failure ${{env.BUILD_TYPE}}
